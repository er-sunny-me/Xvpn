[package]
name = "client"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "Xvpn"
path = "src/main.rs"

[dependencies]
bincode = "1.3.3"
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = "3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { path = "../shared" }
wintun = "0.5.1"

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_Security", "Win32_UI_Shell"]
