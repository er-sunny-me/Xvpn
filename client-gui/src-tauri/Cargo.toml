[package]
name = "xvpn-gui"
version = "1.0.0"
description = "Xvpn Native Client"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wintun = "0.5.1"
bincode = "1.3.3"
ctrlc = "3.4"
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_UI_Shell"] }
shared = { path = "../../shared" }

[features]
custom-protocol = ["tauri/custom-protocol"]
